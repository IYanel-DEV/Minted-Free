# ---------------------------------------------------------------------------
# Minted - English language bundle.
#
# This file is copied out on first run and is the built-in fallback for every
# key, so a translation only needs the lines it wants to change. Use & colour
# codes and {placeholder} tokens; the tokens are documented next to each line.
# ---------------------------------------------------------------------------

