# ---------------------------------------------------------------------------
# Minted configuration
# ---------------------------------------------------------------------------

lang:
  # Language file to use from the lang/ folder (without the .yml). en ships
  # built in and is copied out on first run; it is also the fallback for any
  # key a translation leaves out.
  code: en

currency:
  # Display name of the currency unit used across all GUIs and messages.
  name: Coins
  singular: Coin
  # Symbol prepended to formatted balances.
  symbol: "$"
  # Render big amounts with short suffixes instead of full digits: k=1,000,
  # m=1,000,000, b=1,000,000,000, t=1,000,000,000,000, q=1,000,000,000,000,000
  # (so 10,000 -> 10k, 1,000,000 -> 1m, 10,000,000,000,000,000 -> 10q). Display
  # only - the stored value is always a plain number, and amount input (all,
  # half, max, raw numbers) is unaffected. Off by default.
  compact: false

# --- Third-party integrations ---
integrations:
  # Fire dev.minted.api.event.MintedBalanceChangeEvent for every wallet/bank
  # change, so other plugins can observe Minted's economy. Costs one event per
  # balance movement; turn off only if a profiler says it matters.
  events: true
  # Which balance external APIs (Vault, placeholders, MintedEconomy#getBalance)
  # read and write: 'bank' (recommended) or 'wallet'. The bank is a digital
  # account that works for offline players; the wallet may be physical notes.
  primary-balance: bank
  # Register Minted as the server's Vault economy so EssentialsX, shops, Towny
  # and every other Vault-aware plugin read and move money through Minted.
  # Ignored when Vault is not installed. Set false to stay self-contained.
  vault:
    register: true
  # Register the %minted_*% placeholders with PlaceholderAPI. Ignored when
  # PlaceholderAPI is not installed. Set false to turn them off.
  placeholders:
    register: true
  # EssentialsX runs a duplicate economy by default. When it is installed,
  # Minted logs one startup message explaining how to point Essentials at
  # Minted (via Vault). Pure awareness - disable it if the message is noise.
  essentials:
    warn: true

database:
  # Storage backend. sqlite ships zero-config; mysql requires the fields below
  # and enables cross-server syncing on BungeeCord/Velocity networks.
  type: sqlite
  host: localhost
  port: 3306
  database: minted
  username: root
  password: ""
  # Connection pool size. One thread per requested pool slot, allocated lazily.
  pool-size: 8

economy:
  # Physical money. When true (the default) a player's wallet IS the signed
  # banknotes in their inventory: shops pay and charge real cash, /bank deposit
  # and right-clicking a note bank it, and money that is lost (dropped, died
  # without keepInventory) is gone for good. Set to false for a classic digital
  # wallet balance - then notes are just a way to carry money, redeemed back into
  # the wallet on right-click, and shops move the digital balance. The bank is
  # always a digital silo either way.
  physical: true
  # Starting balance granted to players on first join. In physical mode this is
  # the digital wallet only, which is unused, so leave it at 0.
  starting-balance: 0
  # Hard cap for any single balance. Guards against overflow duplication bugs.
  # Applies to the wallet and the bank alike.
  max-balance: 1000000000

player_interact:
  # How the payment menu opens when you interact with another player:
  # shift_right_click (sneak + right-click) or right_click.
  action: shift_right_click

bank:
  # Amount buttons shown in the send, request and bank menus.
  presets: [50, 100, 500]
  # How long a money request stays valid before it is dropped.
  request-expiry-seconds: 60
  # Combat lock. Taking a hit blocks bank deposits for a short window so players
  # cannot stash their cash mid-fight. Only deposits are affected - withdrawals,
  # /pay, shop trading and money requests all keep working.
  hit-lock:
    # Master switch. When false the feature is completely inert.
    enabled: true
    # How long the deposit block lasts after a hit. A fresh hit refreshes the
    # window rather than extending it.
    seconds: 8
    # What counts as a hit: 'any' entity attack (mobs included) or only when the
    # damager is another 'player'. Environmental damage (fall, lava, drowning)
    # never triggers the lock either way.
    trigger: any
  # The bank pays a small return on every stored balance, a reward for keeping
  # money on deposit. Money it pays is newly created, so the economy grows.
  interest:
    # Master switch. When false the feature is completely inert.
    enabled: true
    # Percent of the balance added to each account at every payout.
    rate: 0.1
    # How often a payout happens, in minutes. 30 = every half hour.
    interval-minutes: 30
  # Loans: the bank prints money for a player now, and they repay principal
  # plus a one-time fee later. Outstanding loans are repaid from the bank
  # balance, so a loan adds money to the economy until it is settled.
  loan:
    # Largest single loan a player can take at once.
    max: 5000
    # One-time charge, as a percent of the principal, added to what must be
    # repaid. 10 means a $1,000 loan costs $1,100 to settle.
    fee-percent: 10
    # How long a player has to repay before late fees kick in, in minutes.
    # 10080 = one week.
    term-minutes: 10080
    # Late fee: percent added to the outstanding owed at every payout while the
    # loan is overdue. It compounds, so an ignored loan keeps growing.
    late-fee-percent: 2

# Player bounties. Posting a bounty draws the reward out of the placer's bank
# and escrows it on the posting; whoever kills the target collects every open
# bounty on them into their bank. From the board (/bounty) the placer - or an
# admin - can pull a bounty back for a full refund at any time.
bounty:
  # Master switch. When false the whole feature is inert and /bounty is gone.
  enabled: true
  # Smallest and largest amounts a single posting may be. The running total on
  # one player is also capped at the maximum.
  min: 100
  max: 1000000

# --- Resource Pack & Visuals ---
# When enabled, the plugin will prompt players to download a resource pack
# that gives banknotes and checks their own custom textures (1.14+).
resource-pack:
  enabled: true
  # URL to the .zip file and its SHA-1 hash for verification.
  url: "https://example.com/minted-pack.zip"
  hash: ""

# --- Physical Wallet ---
# When enabled, players can use a "Wallet" item to store banknotes and checks,
# saving inventory space while still being able to pay directly from it.
wallet:
  enabled: true
  # Material used for the wallet item.
  material: "LEATHER"

shops:
  # Name of the shop that /sell trades against. This is an ordinary shop (the
  # seeded starter shop by default); /sell never creates a second economy, it
  # simply sells the held item to this shop at its configured buy price.
  global: Spawn

sounds:
  # Money-moment sound effects, played only to the one player who should hear it.
  # Master switch: when false the whole feature is inert.
  enabled: true
  # Playback volume, 0.0 - 1.0.
  volume: 1.0
  # Which sound each moment plays. Use 1.8-era Sound names (e.g. NOTE_BASS,
  # ORB_PICKUP, NOTE_PLING, LEVEL_UP, ANVIL_LAND); they are auto-translated to
  # the modern spelling on 1.13+. An unknown name simply plays nothing.
  pay-sent: NOTE_BASS
  pay-received: ORB_PICKUP
  request-received: NOTE_PLING
  # A bounty reward being paid out to a killer.
  bounty-collected: ANVIL_LAND

money:
  # Denominations minted when the bank pays out physical cash (/bank withdraw).
  # The amount is split into these notes largest-first; any leftover that no
  # denomination divides becomes a single odd note of the remainder. The ladder
  # climbs to the largest sane note so big payouts fit in a pocket instead of a
  # flood of tiny paper; it mirrors economy.max-balance, so admins running an
  # enormous economy should extend it further (the mint stays bounded regardless
  # - amounts above the largest note are handed out as a few ad-hoc big notes).
  # Invalid (<= 0) entries are dropped with a warning; an empty list falls back
  # to the classic small set.
  denominations: [1, 5, 10, 50, 100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000]