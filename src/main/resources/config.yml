# =============================================================================
# Minted - Configuration
# =============================================================================
# This is the ONLY config file you need. Everything is organized into clear
# sections with detailed comments. All options have sensible defaults.
# 
# Quick start: Just install the plugin and it works! Tweak only what you need.
# =============================================================================

# -----------------------------------------------------------------------------
# LANGUAGE
# -----------------------------------------------------------------------------
lang:
  # Language file to use (from lang/ folder, without .yml).
  # Built-in: en (English). Add your own translations to lang/ folder.
  code: en

# -----------------------------------------------------------------------------
# CURRENCY DISPLAY (Single Currency Mode)
# -----------------------------------------------------------------------------
# These settings control how money LOOKS in chat, GUIs, and messages.
# The actual stored value is always a plain number.
currency:
  # Display name shown in GUIs and messages (plural)
  name: "Coins"
  # Singular form (for "1 Coin")
  singular: "Coin"
  # Symbol prepended to amounts (e.g., $100)
  symbol: "$"
  # Shorten large numbers: 10000 -> 10k, 1000000 -> 1m, etc.
  # Purely visual - does NOT affect stored values or input parsing.
  compact: false

# -----------------------------------------------------------------------------
# MULTI-CURRENCY (Advanced)
# -----------------------------------------------------------------------------
# Enable to support multiple currencies with exchange rates (e.g., Coins, Gems, Tokens).
# When DISABLED (default), the single currency above is used everywhere.
# When ENABLED, all balances are stored in the BASE currency internally.
multi-currency:
  enabled: false
  base:
    # Internal ID (lowercase, no spaces) - used for database/storage
    id: "coins"
    # Display name
    name: "Coins"
    # Singular form
    singular: "Coin"
    # Symbol
    symbol: "$"
  # Additional currencies are added in-game with /currency create
  # Example: /currency create gems Gem ♦ 100 1
  #   id=gems, name=Gems, singular=Gem, symbol=♦, rate=100 (1 Coin = 100 Gems), sort=1

# -----------------------------------------------------------------------------
# DATABASE
# -----------------------------------------------------------------------------
# SQLite works out of the box (zero config). Use MySQL for multi-server networks.
database:
  # Backend: "sqlite" (file-based, zero config) or "mysql" (network, for Bungee/Velocity)
  type: "sqlite"
  
  # MySQL only - ignored for SQLite
  host: "localhost"
  port: 3306
  database: "minted"
  username: "root"
  password: ""
  
  # Connection pool size (concurrent DB connections). Increase for busy servers.
  pool-size: 8

# -----------------------------------------------------------------------------
# ECONOMY CORE
# -----------------------------------------------------------------------------
economy:
  # PHYSICAL MODE (default): Wallet = actual banknotes in inventory.
  #   - Shops pay/charge real cash items
  #   - /bank deposit takes physical notes from inventory
  #   - Dropped/lost money is GONE forever (hardcore economy)
  # DIGITAL MODE (false): Wallet = digital balance.
  #   - Notes are just convenience items, auto-redeemed on right-click
  #   - Shops move digital balance only
  #   - Money never lost on death/drop
  physical: true
  
  # Starting balance for new players (digital wallet only).
  # In physical mode, leave at 0 - players start with empty pockets.
  starting-balance: 0
  
  # Absolute maximum balance per player (wallet + bank combined).
  # Prevents overflow exploits. 1 billion = 1,000,000,000
  max-balance: 1000000000

# -----------------------------------------------------------------------------
# PLAYER INTERACTION
# -----------------------------------------------------------------------------
player_interact:
  # How to open payment menu when clicking another player:
  # "shift_right_click" = Sneak + Right-click (recommended, prevents accidents)
  # "right_click" = Just right-click (simpler but can misfire)
  action: "shift_right_click"

# -----------------------------------------------------------------------------
# BANK
# -----------------------------------------------------------------------------
bank:
  # Quick-amount buttons in send/request/bank menus
  presets: [50, 100, 500]
  
  # How long a money request (/request) stays valid (seconds)
  request-expiry-seconds: 60
  
  # FEES (money sinks - removed from economy permanently)
  fee:
    # % taken when withdrawing from bank to cash (on top of amount)
    withdraw-percent: 0
    # % taken when paying another player (sender pays fee, recipient gets full)
    transfer-percent: 0
  
  # COMBAT LOCK - Prevents combat logging by blocking deposits after taking damage
  hit-lock:
    enabled: true
    # Seconds deposit is blocked after taking damage
    seconds: 8
    # What triggers it: "any" (mobs + players) or "player" (players only)
    trigger: "any"
  
  # INTEREST - Passive income for keeping money in bank
  interest:
    enabled: true
    # % of balance added each payout (0.1 = 0.1%)
    rate: 0.1
    # Payout interval in minutes (30 = every half hour)
    interval-minutes: 30
  
  # LOANS - Bank prints money, player repays later with fee
  loan:
    # Maximum single loan amount
    max: 5000
    # One-time fee % added to principal (10 = $1000 loan costs $1100 to repay)
    fee-percent: 10
    # Repayment term in minutes (10080 = 1 week)
    term-minutes: 10080
    # Late fee % per payout while overdue (compounds!)
    late-fee-percent: 2

# -----------------------------------------------------------------------------
# BOUNTIES
# -----------------------------------------------------------------------------
bounty:
  enabled: true
  # Min/max for a single bounty posting
  min: 100
  max: 1000000
  # Max total escrowed on one player at once (0 = unlimited)
  max-open: 2000000
  # Auto-refund after this many days (0 = never expire)
  expiry-days: 0

# -----------------------------------------------------------------------------
# AUCTION HOUSE
# -----------------------------------------------------------------------------
auction:
  enabled: true
  # % fee charged to seller when listing (taken from wallet)
  listing-fee-percent: 1.0
  # Minimum starting bid
  min-start-price: 1.0
  # Maximum auction duration in hours (168 = 1 week)
  max-duration-hours: 168
  # Minimum duration in minutes
  min-duration-minutes: 10
  # Max concurrent auctions per player
  max-per-player: 10

# -----------------------------------------------------------------------------
# RESOURCE PACK
# -----------------------------------------------------------------------------
# Prompts players to download custom textures for banknotes/wallet (1.14+)
resource-pack:
  enabled: true
  # Direct download URL to .zip file
  url: "https://example.com/minted-pack.zip"
  # SHA-1 hash for verification (leave empty to skip check)
  hash: ""

# -----------------------------------------------------------------------------
# PHYSICAL WALLET ITEM
# -----------------------------------------------------------------------------
wallet:
  enabled: true
  # Material for the wallet item (any valid Bukkit material name)
  material: "LEATHER"

# -----------------------------------------------------------------------------
# SHOPS
# -----------------------------------------------------------------------------
shops:
  # Shop name used by /sell command (must match a created shop)
  global: "Spawn"
  # How many personal (player-owned) shops one account may open with /pshop.
  max-player-shops: 1

# -----------------------------------------------------------------------------
# SOUNDS
# -----------------------------------------------------------------------------
# Uses 1.8 sound names (auto-converted on newer versions)
sounds:
  enabled: true
  volume: 1.0
  pay-sent: "NOTE_BASS"
  pay-received: "ORB_PICKUP"
  request-received: "NOTE_PLING"
  bounty-collected: "ANVIL_LAND"

# -----------------------------------------------------------------------------
# BANKNOTE DENOMINATIONS
# -----------------------------------------------------------------------------
# Physical cash denominations when withdrawing from bank.
# Largest-first greedy split. Extend for large economies.
money:
  denominations: [1, 5, 10, 50, 100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000]

# -----------------------------------------------------------------------------
# THIRD-PARTY INTEGRATIONS
# -----------------------------------------------------------------------------
# All optional. Minted works 100% standalone. Enable only what you need.
integrations:
  # Fire MintedBalanceChangeEvent for other plugins to listen to
  events: true
  
  # Which balance Vault/Placeholders/API see: "bank" (recommended) or "wallet"
  primary-balance: "bank"
  
  # VAULT - Make Minted the server economy for EssentialsX, Towny, shops, etc.
  vault:
    register: false  # Set true if you have Vault and want other plugins to use Minted
  
  # PLACEHOLDERAPI - Enable %minted_*% placeholders
  placeholders:
    register: true
  
  # ESSENTIALSX - Warn if Essentials runs its own economy alongside Minted
  essentials:
    warn: true
  
  # PROTOCOLLIB - Bank teller NPCs (fake players, no Citizens needed)
  npcs:
    enabled: true
    # Seconds teller stays in tab list before hiding (lets skin download)
    tab-hide-seconds: 5
    # Default teller display name, used when /minted npc create is run
    # without a name. & colour codes work (&e = yellow). The mock-player
    # username is this name with colours stripped, e.g. "&eBanker" -> "Banker".
    name: "&eBanker"
    # Default teller skin: a mustachioed bank man in a suit (textures value).
    # The value alone renders on most setups; servers that enforce secure
    # profiles may show Steve for unsigned values. To guarantee a Mojang-signed
    # skin, set skin-player to any player name and Minted fetches it live.
    skin-value: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZTAxMDA4ZTFkOGI5MjRhOGQ0YjFkMTFmMmZkMWNmZmE0YzdjZWFlYTBlNzhiZmZkYWJkM2NlODFkZjdmOTI4YiJ9fX0="
    skin-signature: ""
    skin-player: ""

# =============================================================================
# QUICK REFERENCE: COMMON SETUPS
# =============================================================================
# 
# CLASSIC DIGITAL ECONOMY (Essentials-style):
#   economy.physical: false
#   economy.starting-balance: 1000
#   bank.interest.enabled: false
#   bank.loan.enabled: false
#   bounty.enabled: false
#   auction.enabled: false
# 
# HARDCORE PHYSICAL ECONOMY (Hermitcraft-style):
#   economy.physical: true
#   economy.starting-balance: 0
#   bank.fee.withdraw-percent: 1.0
#   bank.fee.transfer-percent: 0.5
#   bank.hit-lock.enabled: true
# 
# RPG SERVER WITH MULTIPLE CURRENCIES:
#   multi-currency.enabled: true
#   multi-currency.base.id: "gold"
#   multi-currency.base.name: "Gold"
#   multi-currency.base.symbol: "⛁"
#   # Then in-game: /currency create silver Silver ⛂ 100 1
#   # And: /currency create copper Copper ⛃ 10000 2
# 
# MINIMAL / LIGHTWEIGHT (just balances + pay + shop):
#   bank.interest.enabled: false
#   bank.loan.enabled: false
#   bounty.enabled: false
#   auction.enabled: false
#   wallet.enabled: false
#   resource-pack.enabled: false
#   sounds.enabled: false
# 
# NETWORK / BUNGEECORD (MySQL):
#   database.type: "mysql"
#   database.host: "db.example.com"
#   database.database: "minted_network"
#   database.username: "minted"
#   database.password: "secure_password"
#   integrations.vault.register: true
# =============================================================================