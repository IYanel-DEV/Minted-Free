# ---------------------------------------------------------------------------
# Minted - plugin descriptor
#
# api-version is intentionally NOT set. It tells the server to enable legacy
# behaviour (legacy material names, etc.). Since Minted ships 1.8 -> 1.26 in
# a single jar, omitting it keeps startup behaviour identical everywhere.
# Version-specific behaviour is handled by the compat layer, never by the
# server's own legacy switch.
# ---------------------------------------------------------------------------

name: Minted
version: ${project.version}
description: GUI-first economy for premium survival and roleplay servers.
author: iyanel-dev
website: https://github.com/IYanel-DEV/Minted-Free
main: dev.minted.MintedPlugin
# Optional hooks; Minted works fully without any of these present.
softdepend: [Vault, PlaceholderAPI, Essentials]

commands:
  minted:
    description: Main Minted command.
    aliases: [mint]
    usage: /minted [gui|reload]
  balance:
    description: Check a balance.
    aliases: [bal, money]
    usage: /balance [player]
  pay:
    description: Pay another player.
    usage: /pay <player> <amount>
  wallet:
    description: Get your wallet, or open the one you hold.
    usage: /wallet
  bank:
    description: Open your bank, or deposit and withdraw.
    usage: /bank [deposit|withdraw] <amount>
  sell:
    description: Sell the item in your hand to the global shop.
    usage: /sell [amount]
  mstats:
    description: Open the server-wide economy stats.
    aliases: [economy]
    usage: /mstats
  bounty:
    description: Place or view player bounties.
    usage: /bounty [player] [amount] [note]
  eshop:
    description: Browse the shops, or manage them as an admin.
    aliases: [shop, shops]
    usage: /eshop [shop|create|delete|edit|reload|setcurrency]

permissions:
  minted.use:
    description: Access to the Minted economy.
    default: true
  minted.admin:
    description: Manage Minted and reload its configuration.
    default: op
  minted.balance:
    description: Check your own balance.
    default: true
  minted.balance.others:
    description: Check another player's balance.
    default: op
  minted.pay:
    description: Pay another player.
    default: true
  minted.wallet:
    description: Get and use a wallet item.
    default: true
  minted.bank:
    description: Use your bank.
    default: true
  minted.sell:
    description: Sell held items to the global shop.
    default: true
  minted.stats:
    description: View the server-wide economy stats.
    default: true
  minted.bounty:
    description: Place, view and refund player bounties.
    default: true
  minted.shop.use:
    description: Browse and trade at shops.
    default: true
  minted.shop.admin:
    description: Create, edit and reload shops.
    default: op