# ---------------------------------------------------------------------------
# Minted - plugin descriptor
#
# api-version: 1.13 opts out of the server's legacy-material mode. A plugin
# without api-version forces Paper/Spigot to enable CraftLegacy, where
# Material.getMaterial()/matchMaterial() answer with legacy names only - so
# modern constants (OAK_PLANKS, RED_WOOL, TRIDENT, ...) resolve to null even
# though they exist in the 1.13+ enum, and every colour variant collapses into
# its base item. On 1.13+ with this line set, modern constants resolve
# normally; on 1.12 and below the value is ignored, so the single 1.8 -> 1.26
# jar keeps working on both sides of the flattening.
# ---------------------------------------------------------------------------

name: Minted
version: ${project.version}
description: GUI-first economy for premium survival and roleplay servers.
author: iyanel-dev
website: https://github.com/IYanel-DEV/Minted-Free
main: dev.minted.MintedPlugin
api-version: 1.13
# Optional hooks; Minted works fully without any of these present. ViaVersion
# (with ViaBackwards/ViaRewind) makes the catalog and item handouts follow the
# client's own Minecraft version; everything is reflection-guarded.
softdepend: [Vault, VaultUnlocked, PlaceholderAPI, Essentials, ProtocolLib, ViaVersion, ItemsAdder, Nexo, Oraxen]

commands:
  minted:
    description: Main Minted command.
    aliases: [mint]
    usage: /minted [help|gui|dashboard|reload|report|npc|vip|selftest|source|shops]
  balance:
    description: Check a balance.
    aliases: [bal, money]
    usage: /balance [player]
  pay:
    description: Pay another player.
    usage: /pay <player> <amount>
  donate:
    description: Donate money to an online player with a little fanfare.
    aliases: [tip]
    usage: /donate <player> <amount>
  wallet:
    description: Get your wallet, or open the one you hold.
    usage: /wallet
  bank:
    description: Open your bank, or deposit and withdraw.
    usage: /bank [deposit|withdraw] <amount>
  sell:
    description: Sell the item in your hand to the global shop, or open the sell menu.
    usage: /sell [amount|all|menu]
  mstats:
    description: Open the server-wide economy stats.
    aliases: [economy]
    usage: /mstats
  mhistory:
    description: Open your personal transaction history.
    aliases: [history, hst]
    usage: /mhistory
  bounty:
    description: Place or view player bounties.
    usage: /bounty [player] [amount] [note]
  ah:
    description: Open the auction house.
    aliases: [auction, auctionhouse]
    usage: /ah [create|my|bids|expire|cancel|reload]
  language:
    description: View or change language.
    aliases: [lang]
    usage: /language [set <code>|reset|list|global <code>|reload]
  eshop:
    description: Browse the shops, or manage them as an admin.
    aliases: [shop, shops]
    usage: /eshop [shop|create|delete|edit|reload|setcurrency]
  pshop:
    description: Open and run your own player shop.
    usage: /pshop [create <name>|add <price>|addstack <price>|sell|my|open <name>|browse|delete [name]]
  eco:
    description: Administer player balances, and export or import them. Console only.
    usage: /eco [give|take|set|reset] <player> [amount] | /eco [export|import] <file> [confirm] (console only)
  sh:
    description: Reopen your last view in the global shop.
    usage: /sh
  psh:
    description: Reopen the last player shop you were viewing, or your own.
    usage: /psh

permissions:
  minted.use:
    description: Access to the Minted economy.
    default: true
  minted.admin:
    description: Manage Minted and reload its configuration.
    default: op
  minted.balance:
    description: Check your own balance.
    default: true
  minted.balance.others:
    description: Check another player's balance.
    default: op
  minted.pay:
    description: Pay another player.
    default: true
  minted.donate:
    description: Donate money to another online player.
    default: true
  minted.donate.others:
    description: Tab-complete other players when donating (the command itself still works for everyone with minted.donate).
    default: true
  minted.wallet:
    description: Get and use a wallet item.
    default: true
  minted.bank:
    description: Use your bank.
    default: true
  minted.sell:
    description: Sell held items to the global shop.
    default: true
  minted.stats:
    description: View the server-wide economy stats.
    default: true
  minted.history:
    description: View your personal transaction history.
    default: true
  minted.bounty:
    description: Place, view and refund player bounties.
    default: true
  minted.shop.use:
    description: Browse and trade at shops.
    default: true
  minted.shop.admin:
    description: Create, edit and reload shops.
    default: op
  minted.shop.own:
    description: Open your own player shop and list items in it.
    default: true
  minted.vip:
    description: Counts as a VIP and gets the automatic /<username> shop command when they own a shop. Grant it with your permission plugin.
    default: false
  minted.eco:
    description: Give, take, set and reset player balances. Console only - never usable in game, even with op.
    default: op